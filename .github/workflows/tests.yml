name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip PyYAML ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      # Same suite with hermes_cli unimportable and no hermes on PATH: the runner has no Hermes,
      # and a test that only passes on a machine with one is a test this project cannot trust.
      - name: Run tests without Hermes installed
        run: python tests/run_without_hermes.py
