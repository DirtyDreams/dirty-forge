name: DirtyForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip && pip install PyYAML fastapi ruff
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Lint with ruff
        run: ruff check .
      - name: Syntax-check Desktop UI ESM
        run: node --check desktop/plugin.js
